services:
  projects:
    build: .
    image: projects-studio:1.1.1
    container_name: projects-studio
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Projects Studio}
      WORKSPACE_SLUG: ${WORKSPACE_SLUG:-}
      APP_URL: ${APP_URL:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      SEED_DATA: ${SEED_DATA:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      INVITE_DAYS: ${INVITE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HELO: ${SMTP_HELO:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_ALLOW_INSECURE_AUTH: ${SMTP_ALLOW_INSECURE_AUTH:-false}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-15000}
      SECURE_COOKIE: ${SECURE_COOKIE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      DATA_DIR: /data
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (32+ random chars; encrypts TOTP secrets — losing it locks out 2FA)}
    volumes:
      - projects-studio-data:/data
    # No published port: Traefik reaches the container over the shared network.
    expose:
      - '8080'
    networks:
      - traefik
    labels:
      traefik.enable: 'true'
      # Must name the network shared with Traefik.
      traefik.docker.network: 'traefik'

      traefik.http.routers.projects-studio.rule: 'Host(`${PRJSTUDIO_HOST:-projects.example.com}`)'
      traefik.http.routers.projects-studio.entrypoints: 'websecure'
      traefik.http.routers.projects-studio.tls: 'true'
      traefik.http.routers.projects-studio.tls.certresolver: 'letsencrypt'
      traefik.http.routers.projects-studio.middlewares: 'projects-studio-compress'
      traefik.http.services.projects-studio.loadbalancer.server.port: '8080'

      traefik.http.routers.projects-studio-http.rule: 'Host(`${PRJSTUDIO_HOST:-projects.example.com}`)'
      traefik.http.routers.projects-studio-http.entrypoints: 'web'
      traefik.http.routers.projects-studio-http.middlewares: 'projects-https'
      traefik.http.middlewares.projects-studio-https.redirectscheme.scheme: 'https'

      traefik.http.middlewares.projects-studio-compress.compress: 'true'

volumes:
  projects-studio-data:

networks:
  traefik:
    external: true
