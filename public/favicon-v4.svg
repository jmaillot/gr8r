<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 152" role="img" aria-label="Projects Studio" width="152" height="152">
  <!-- Projects Studio — favicon v4 (PS monogram). Favicon-safe: no CSS vars, no media queries. -->
  <defs>
    <linearGradient id="psv4-tile" x1="76" y1="0" x2="76" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="psv4-ink" x1="40" y1="36" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="psv4-glow" cx="76" cy="78" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="152" height="152" rx="34" fill="url(#psv4-tile)"/>
  <rect width="152" height="152" rx="34" fill="url(#psv4-glow)"/>

  <!-- PS monogram, rounded strokes, interlocked -->
  <g fill="none" stroke="url(#psv4-ink)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- P : hampe à gauche, barre haute, panse retombant à droite -->
    <path d="M26 110 V44 Q26 31 40 31 H70 Q92 31 92 48 Q92 64 70 64 H60"/>
    <!-- S : trois barres, U à gauche puis U à droite, terminaisons haut-droit et bas-gauche -->
    <path d="M125 66 H74 Q56 66 56 78 Q56 89 74 89 H80 Q97 89 97 101 Q97 114 79 114 H48"/>
  </g>

  <!-- inner hairline + rim -->
  <rect x="4" y="4" width="144" height="144" rx="30" fill="none" stroke="#fff" stroke-opacity=".06"/>
  <rect x="1" y="1" width="150" height="150" rx="33" fill="none" stroke="#FDA4AF" stroke-opacity=".35" stroke-width="2"/>
</svg>
