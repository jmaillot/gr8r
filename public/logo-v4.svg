<svg class="psv4-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" role="img" aria-labelledby="psv4-title" width="760" height="208">
  <!-- Projects Studio — logo v4 (PS monogram + wordmark). Light/dark aware via CSS vars. -->
  <title id="psv4-title">Projects Studio</title>
  <style>
    .psv4-logo{ --ink:#0F172A; }
    @media (prefers-color-scheme: dark){
      .psv4-logo{ --ink:#F1F5F9; }
    }
    .psv4-logo.psv4-dark{ --ink:#F1F5F9; }
    .psv4-logo.psv4-light{ --ink:#0F172A; }
    .psv4-word{ fill:var(--ink); font-family:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:64px; font-weight:600; letter-spacing:-0.01em; }
  </style>

  <defs>
    <linearGradient id="psv4l-tile" x1="76" y1="0" x2="76" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="psv4l-ink" x1="40" y1="36" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="psv4l-rule" x1="209" y1="0" x2="529" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="psv4l-glow" cx="76" cy="78" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(0 28)">
    <rect width="152" height="152" rx="34" fill="url(#psv4l-tile)"/>
    <rect width="152" height="152" rx="34" fill="url(#psv4l-glow)"/>
    <g fill="none" stroke="url(#psv4l-ink)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 110 V44 Q26 31 40 31 H70 Q92 31 92 48 Q92 64 70 64 H60"/>
      <path d="M125 66 H74 Q56 66 56 78 Q56 89 74 89 H80 Q97 89 97 101 Q97 114 79 114 H48"/>
    </g>
    <rect x="4" y="4" width="144" height="144" rx="30" fill="none" stroke="#fff" stroke-opacity=".06"/>
    <rect x="1" y="1" width="150" height="150" rx="33" fill="none" stroke="#FDA4AF" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text class="psv4-word" x="204" y="96">Projects Studio</text>
  <rect x="209" y="122" width="320" height="2" rx="1" fill="url(#psv4l-rule)" opacity=".9"/>
</svg>
