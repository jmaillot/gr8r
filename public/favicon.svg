      --ps-tile-a:#1D1338;--ps-tile-b:#0A0714;
      --ps-rim-a:#8B63F5;--ps-rim-b:#FFB86B;--ps-rim-w:1.5;}
  .ps-word{fill:var(--ps-ink)}
  .ps-sub{fill:var(--ps-ink-soft)}
  .ps-rim{stroke-width:var(--ps-rim-w)}
</style>
  
