<svg class="ps-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 152" role="img" aria-label="Projects Studio" width="152" height="152">
  <style>
  .ps-logo{--ps-ink:#14111F;--ps-ink-soft:#6A6580;
      --ps-tile-a:#1D1338;--ps-tile-b:#0A0714;
      --ps-rim-a:#8B63F5;--ps-rim-b:#FFB86B;--ps-rim-w:1.5;}
  @media (prefers-color-scheme: dark){ .ps-logo{--ps-ink:#F7F5FF;--ps-ink-soft:#B3ADC9;
      --ps-tile-a:#33245F;--ps-tile-b:#1A1035;
      --ps-rim-a:#D6C4FF;--ps-rim-b:#FFDCB8;--ps-rim-w:1.75;} }
